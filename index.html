<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<title>数字カウンター</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", sans-serif;
  background: #f4f4f4;
}

body {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding:
    max(20px, env(safe-area-inset-top))
    20px
    max(20px, env(safe-area-inset-bottom));
}

.app {
  width: 100%;
  max-width: 520px;
  text-align: center;
}

.title {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 25px;
  color: #555;
}

#number {
  font-size: clamp(4rem, 22vw, 8rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: .06em;
  margin-bottom: 45px;
  color: #111;
  word-break: break-all;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

button {
  min-height: 72px;
  border: 0;
  border-radius: 18px;
  background: white;
  color: #111;
  font-size: 1.25rem;
  font-weight: 700;
  box-shadow: 0 4px 12px #0002;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .08s, box-shadow .08s;
}

button:active {
  transform: scale(.96);
  box-shadow: 0 2px 6px #0002;
}

#prev {
  background: #e8e8e8;
}

#next {
  background: #111;
  color: white;
}

.reset {
  grid-column: 1 / -1;
  margin-top: 5px;
  min-height: 60px;
  background: #ddd;
  color: #333;
  font-size: 1.05rem;
}

/* 横画面 */
@media (orientation: landscape) {
  body {
    padding-top: 15px;
    padding-bottom: 15px;
  }

  #number {
    font-size: clamp(3rem, 15vw, 6rem);
    margin-bottom: 25px;
  }

  button {
    min-height: 60px;
  }
}

/* ダークモード */
@media (prefers-color-scheme: dark) {
  html, body {
    background: #111;
  }

  .title {
    color: #aaa;
  }

  #number {
    color: white;
  }

  button {
    background: #2a2a2a;
    color: white;
    box-shadow: 0 4px 12px #0008;
  }

  #prev {
    background: #333;
  }

  #next {
    background: white;
    color: #111;
  }

  .reset {
    background: #333;
    color: #ddd;
  }
}
</style>
</head>

<body>

<main class="app">

  <div class="title">数字カウンター</div>

  <div id="number">12345</div>

  <div class="buttons">
    <button id="prev">1つ前</button>
    <button id="next">次</button>
    <button id="reset" class="reset">リセット</button>
  </div>

</main>

<script>
let start = Number(localStorage.getItem('counterStart')) || 1;
      
const n = document.getElementById('number');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const reset = document.getElementById('reset');

function render() {
  n.textContent = Array.from(
  { length: 5 },
  (_, i) => start + i
).join('・');
}

next.onclick = () => {
  start++;
  localStorage.setItem('counterStart', start);
  render();
};

prev.onclick = () => {
  if (start > 1) {
    start--;
    localStorage.setItem('counterStart', start);
    render();
  }
};

reset.onclick = () => {
  start = 1;
  localStorage.setItem('counterStart', start);
  render();
};

render();

if ('serviceWorker' in navigator) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>

</body>
</html>
