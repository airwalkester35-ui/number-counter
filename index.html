<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<title>数字カウンター</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", sans-serif;
  background: #f4f4f4;
}

body {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding:
    max(20px, env(safe-area-inset-top))
    20px
    160px;
}

.app {
  width: 100%;
  max-width: 520px;
  text-align: center;
}

.title {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 20px;
  color: #555;
}

/* 開始番号設定 */
.setting {
  display: flex;
  gap: 8px;
  margin-bottom: 25px;
}

#startInput {
  flex: 1;
  min-width: 0;
  height: 50px;
  padding: 0 14px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 1.1rem;
  text-align: center;
  background: white;
  color: #111;
}

#setStart {
  width: 90px;
  border: 0;
  border-radius: 12px;
  background: #555;
  color: white;
  font-size: 1rem;
  font-weight: 700;
}

#number {
  width: 100%;
  font-size: clamp(2rem, 10vw, 5rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0;
  margin-bottom: 45px;
  color: #111;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: clip;
}

.buttons {
  position: fixed;
  left: 20px;
  right: 20px;
  bottom: max(20px, env(safe-area-inset-bottom));

  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;

  max-width: 520px;
  margin: 0 auto;
}

button {
  min-height: 72px;
  border: 0;
  border-radius: 18px;
  background: white;
  color: #111;
  font-size: 1.25rem;
  font-weight: 700;
  box-shadow: 0 4px 12px #0002;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .08s, box-shadow .08s;
}

button:active {
  transform: scale(.96);
  box-shadow: 0 2px 6px #0002;
}

#prev {
  background: #e8e8e8;
}

#next {
  background: #111;
  color: white;
}

.reset {
  grid-column: 1 / -1;
  margin-top: 5px;
  min-height: 60px;
  background: #ddd;
  color: #333;
  font-size: 1.05rem;
}

/* 長押し中 */
.reset.holding {
  transform: scale(.96);
  opacity: .7;
}

/* 横画面 */
@media (orientation: landscape) {
  body {
    padding-top: 15px;
    padding-bottom: 15px;
  }

  #number {
    font-size: clamp(3rem, 15vw, 6rem);
    margin-bottom: 25px;
  }

  button {
    min-height: 60px;
  }
}

/* ダークモード */
@media (prefers-color-scheme: dark) {
  html, body {
    background: #111;
  }

  .title {
    color: #aaa;
  }

  #number {
    color: white;
  }

  #startInput {
    background: #2a2a2a;
    color: white;
    border-color: #555;
  }

  #setStart {
    background: #aaa;
    color: #111;
  }

  button {
    background: #2a2a2a;
    color: white;
    box-shadow: 0 4px 12px #0008;
  }

  #prev {
    background: #333;
  }

  #next {
    background: white;
    color: #111;
  }

  .reset {
    background: #333;
    color: #ddd;
  }
}
</style>
</head>

<body>

<main class="app">

  <div class="title">数字カウンター</div>

  <div class="setting">
    <input
      id="startInput"
      type="number"
      inputmode="numeric"
      placeholder="開始番号"
    >
    <button id="setStart">開始</button>
  </div>

  <div id="number">1・2・3・4・5</div>

  <div class="buttons">
    <button id="prev">1つ前</button>
    <button id="next">次</button>
    <button id="reset" class="reset">リセット（長押し）</button>
  </div>

</main>

<script>
let start = Number(localStorage.getItem('counterStart')) || 1;

const n = document.getElementById('number');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const reset = document.getElementById('reset');
const startInput = document.getElementById('startInput');
const setStart = document.getElementById('setStart');

function render() {
  n.textContent = Array.from(
    { length: 5 },
    (_, i) => start + i
  ).join('・');

  let size = 80;
  n.style.fontSize = size + 'px';

  while (n.scrollWidth > n.clientWidth && size > 20) {
    size--;
    n.style.fontSize = size + 'px';
  }
}

/* 次 */
next.onclick = () => {
  start++;
  localStorage.setItem('counterStart', start);
  render();
};

/* 1つ前 */
prev.onclick = () => {
  if (start > 1) {
    start--;
    localStorage.setItem('counterStart', start);
    render();
  }
};

/* 開始番号を設定 */
function setStartNumber() {
  const value = Number(startInput.value);

  if (!Number.isInteger(value) || value < 1) {
    alert('1以上の整数を入力してください');
    return;
  }

  start = value;
  localStorage.setItem('counterStart', start);
  render();
  startInput.value = '';
}

setStart.onclick = setStartNumber;

startInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') {
    setStartNumber();
  }
});

/* リセット長押し */
let resetTimer = null;

reset.addEventListener('pointerdown', () => {
  reset.classList.add('holding');

  resetTimer = setTimeout(() => {
    start = 1;
    localStorage.setItem('counterStart', start);
    render();

    reset.classList.remove('holding');
    alert('1にリセットしました');
  }, 1500);
});

function cancelReset() {
  clearTimeout(resetTimer);
  reset.classList.remove('holding');
}

reset.addEventListener('pointerup', cancelReset);
reset.addEventListener('pointerleave', cancelReset);
reset.addEventListener('pointercancel', cancelReset);

render();

if ('serviceWorker' in navigator) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>

</body>
</html>
