<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json">
<title>数字カウンター</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:system-ui,sans-serif;background:#f4f4f4}.app{width:92%;max-width:480px;text-align:center}
#number{font-size:clamp(3.5rem,18vw,7rem);font-weight:700;letter-spacing:.08em;margin-bottom:2rem}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font-size:1.15rem;padding:18px 10px;
border:0;border-radius:14px;background:white;box-shadow:0 2px 8px #0002}.reset{grid-column:1/-1;background:#222;color:white}
</style></head><body><main class="app"><div id="number">12345</div>
<div class="buttons"><button id="prev">1つ前</button><button id="next">次</button>
<button id="reset" class="reset">リセット</button></div></main>
<script>
let start=1;const n=document.getElementById('number');
function render(){n.textContent=Array.from({length:5},(_,i)=>start+i).join('')}
next.onclick=()=>{start++;render()};prev.onclick=()=>{if(start>1)start--;render()};
reset.onclick=()=>{start=1;render()};render();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script></body></html>
